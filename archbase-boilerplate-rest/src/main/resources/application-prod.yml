# ============================================
# ARCHBASE BOILERPLATE - PRODUCTION
# ============================================

spring:
  # Flyway é o dono do schema em produção. O Hibernate apenas CONFERE (ddl-auto: validate) e recusa
  # subir se algo não bater — em vez de alterar o banco por conta própria.
  #
  # baseline-on-migrate cobre a adoção sobre banco que já existe: sem ele, o Flyway se recusa a rodar
  # num schema não-vazio. Com baseline-version=0, a V1 executa mesmo assim; num banco que já tinha as
  # tabelas, remova o V1 ou ajuste a baseline conforme o caso.
  flyway:
    enabled: ${APP_FLYWAY_ENABLED:true}
    baseline-on-migrate: true
    baseline-version: 0

  # JPA para produção
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        show_sql: false

  # Datasource de produção (use variáveis de ambiente)
  datasource:
    postgres:
      jdbc-url: jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT:5432}/${POSTGRES_DATABASE}
      username: ${POSTGRES_USER}
      password: ${POSTGRES_PASSWORD}

# Logging para produção
logging:
  level:
    root: WARN
    br.com.archbase: INFO
    br.com.archbase.boilerplate: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/archbase-boilerplate.log

# Actuator mais restrito
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: never
