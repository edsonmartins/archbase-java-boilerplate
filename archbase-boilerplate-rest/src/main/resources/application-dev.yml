# ============================================
# ARCHBASE BOILERPLATE - DEVELOPMENT
# ============================================

spring:
  # JPA para desenvolvimento
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        show_sql: true
        format_sql: true

# O datasource vem de `application.yml`: PostgreSQL, o mesmo do docker-compose.
#
# O H2 saiu daqui e virou o perfil `h2`, que se escolhe de propósito. Antes ele
# estava no perfil DEFAULT, e o efeito era mudo: o desenvolvedor subia o
# PostgreSQL pelo docker-compose, lia a configuração de PostgreSQL no
# application.yml, e a aplicação rodava em banco de memória. Com `ddl-auto:
# update`, o schema nascia do Hibernate sobre um banco que não é o de produção, e
# a diferença — tipo, DDL, `jsonb` — só aparecia em homologação.
#
# Para usar H2 conscientemente:
#     mvn spring-boot:run -Dspring-boot.run.profiles=h2

# Logging detalhado para desenvolvimento
logging:
  level:
    root: INFO
    br.com.archbase: DEBUG
    br.com.archbase.boilerplate: DEBUG
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

# Actuator com mais detalhes
management:
  endpoints:
    web:
      exposure:
        include: '*'
  endpoint:
    health:
      show-details: always

