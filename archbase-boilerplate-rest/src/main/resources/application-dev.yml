# ============================================
# ARCHBASE BOILERPLATE - DEVELOPMENT
# ============================================

spring:
  # Flyway também em desenvolvimento, e de propósito: se o schema só for exercitado em produção, a
  # migration quebrada só aparece lá. Aqui ela quebra na máquina de quem a escreveu.
  flyway:
    enabled: ${APP_FLYWAY_ENABLED:true}
    baseline-on-migrate: true
    baseline-version: 0

  # JPA para desenvolvimento.
  #
  # ddl-auto continua 'update' aqui por conveniência — mexer numa entidade e ver a coluna aparecer
  # sem escrever migration acelera o começo. O preço é que o banco de desenvolvimento diverge do que
  # as migrations produzem, e ninguém percebe. Ao criar uma entidade nova, escreva a migration e
  # troque para 'validate' localmente ao menos uma vez, para conferir que ela basta.
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        show_sql: true
        format_sql: true

# O datasource vem de `application.yml`: PostgreSQL, o mesmo do docker-compose.
#
# O H2 saiu daqui e virou o perfil `h2`, que se escolhe de propósito. Antes ele
# estava no perfil DEFAULT, e o efeito era mudo: o desenvolvedor subia o
# PostgreSQL pelo docker-compose, lia a configuração de PostgreSQL no
# application.yml, e a aplicação rodava em banco de memória. Com `ddl-auto:
# update`, o schema nascia do Hibernate sobre um banco que não é o de produção, e
# a diferença — tipo, DDL, `jsonb` — só aparecia em homologação.
#
# Para usar H2 conscientemente:
#     mvn spring-boot:run -Dspring-boot.run.profiles=h2

# Logging detalhado para desenvolvimento
logging:
  level:
    root: INFO
    br.com.archbase: DEBUG
    br.com.archbase.boilerplate: DEBUG
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

# Actuator com mais detalhes
management:
  endpoints:
    web:
      exposure:
        include: '*'
  endpoint:
    health:
      show-details: always

