# ============================================
# ARCHBASE BOILERPLATE - DEVELOPMENT
# ============================================

spring:
  # JPA para desenvolvimento
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        show_sql: true
        format_sql: true

  # H2 Console para testes sem PostgreSQL
  h2:
    console:
      enabled: true
      path: /h2-console

  # Datasource H2 para testes locais (quando PostgreSQL não está disponível)
  datasource:
    url: jdbc:h2:mem:archbasedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

# Logging detalhado para desenvolvimento
logging:
  level:
    root: INFO
    br.com.archbase: DEBUG
    br.com.archbase.boilerplate: DEBUG
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

# Actuator com mais detalhes
management:
  endpoints:
    web:
      exposure:
        include: '*'
  endpoint:
    health:
      show-details: always

