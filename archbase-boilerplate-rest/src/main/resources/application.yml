# ============================================
# ARCHBASE BOILERPLATE - APPLICATION.YML
# ============================================

spring:
  profiles:
    active: ${APP_PROFILE:dev}
  application:
    name: archbase-boilerplate

  # Virtual Threads (Java 21+)
  threads:
    virtual:
      enabled: true

  # Datasource Configuration
  # As chaves estavam sob `spring.datasource.postgres.*`, que o Spring Boot NÃO
  # lê e nenhum bean do Archbase consome. O efeito era silencioso: sem DataSource
  # configurado, a aplicação subia no banco embutido — e todo o desenvolvimento
  # acontecia contra um banco que não é o de produção.
  #
  # `url`, não `jdbc-url`: o segundo é nome do Hikari, e o Spring espera o
  # primeiro em `spring.datasource`.
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DATABASE:archbase_db}
    username: ${POSTGRES_USER:archbase}
    password: ${POSTGRES_PASSWORD:changeit}
    hikari:
      maximum-pool-size: 15
      minimum-idle: 4
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      pool-name: ArchbaseHikariPool

  # JPA Configuration
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
        show_sql: false
        jdbc:
          batch_size: 30
        order_inserts: true
        order_updates: true
        cache:
          use_second_level_cache: true
          use_query_cache: true
          region:
            factory_class: org.hibernate.cache.jcache.JCacheRegionFactory
      javax:
        cache:
          provider: org.ehcache.jsr107.EhcacheCachingProvider
    # O `archbase-security` depende do OSIV: `UserEntity.toDto()` percorre a
    # coleção lazy `groups`, e o adapter que o chama não é transacional. Com
    # `false`, `GET /api/v1/user/{id}` devolve 500 — e o controller do framework
    # engole a LazyInitializationException sem log, então o servidor não registra
    # nada e o cliente vê "500" sem corpo.
    open-in-view: true

  # Cache Configuration
  cache:
    type: ehcache
    ehcache:
      config: classpath:ehcache.xml

  # Redis Configuration
  data:
    # -------------------------------------------------------------------------
    # Spring Data REST: detecção apenas do que for anotado.
    #
    # O starter entra por causa do springdoc, e a estratégia PADRÃO publica CRUD
    # HTTP para todo repositório público — inclusive os do archbase-security, com
    # o de token de API entre eles. Seriam escritas diretas no banco, por fora
    # dos serviços e das suas validações.
    #
    # `annotated` exige `@RepositoryRestResource` explícito. Sem anotação, nada
    # é publicado.
    # -------------------------------------------------------------------------
    rest:
      detection-strategy: annotated

    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

  # Web Configuration
  web:
    resources:
      add-mappings: true

# Server Configuration
server:
  port: ${APP_PORT:8080}
  servlet:
    context-path: ${APP_CONTEXT_PATH:/}
  compression:
    enabled: true
  http2:
    enabled: true

# Application Configuration
application:
  security:
    jwt:
      secret-key: ${ARCHBASE_JWT_SECRET:change-this-secret-key-in-production}
      expiration: 86400000
      refresh-token:
        expiration: 604800000
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:4200}
      allowed-methods: GET,POST,PUT,DELETE,PATCH,OPTIONS
      allowed-headers: Authorization,Content-Type,Accept,X-Requested-With,X-Device-ID,X-App-Version,X-TENANT-ID,X-Tenant-Id
      allow-credentials: true

# OpenAPI Configuration
openapi:
  server:
    dev:
      url: http://localhost:${APP_PORT:8080}
      description: Development server
    homolog:
      url: ${OPENAPI_HOMOLOG_URL:}
      description: Homologation server
    prod:
      url: ${OPENAPI_PROD_URL:}
      description: Production server

# Archbase Framework Configuration
archbase:
  multitenancy:
    enabled: true
  app:
    tenant:
      default:
        id: ${ARCHBASE_DEFAULT_TENANT_ID:a9f814d2-4dae-41f3-851b-8aa3d4706561}
    jpa:
      repositories: br.com.archbase.boilerplate.core.infrastructure.output.persistence.repository
      entities: br.com.archbase.boilerplate.core.infrastructure.output.persistence.entity
    component:
      scan: br.com.archbase.boilerplate
  security:
    jwt:
      secret-key: ${ARCHBASE_JWT_SECRET:change-this-secret-key-in-production}
      token-expiration: 86400000
      refresh-expiration: 604800000
    scan-packages: br.com.archbase.boilerplate.rest.infrastructure.input.rest
    whitelist: /actuator/**,/swagger-ui/**,/v3/api-docs/**,/api/v1/public/**
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:4200}
      allowed-methods: GET,POST,PUT,DELETE,PATCH,OPTIONS
      allowed-headers: Authorization,Content-Type,Accept,X-Requested-With,X-Device-ID,X-App-Version,X-TENANT-ID,X-Tenant-Id
      allow-credentials: true

# Logging Configuration
logging:
  level:
    root: INFO
    br.com.archbase: INFO
    br.com.archbase.boilerplate: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

# Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

# Security Configuration
security:
  rate-limit:
    webhook:
      limit: 100
      duration: 60
    authenticated:
      limit: 1000
      duration: 60
    ip:
      limit: 50
      duration: 60
