version: '3.8'

# ============================================
# ARCHBASE BOILERPLATE - DOCKER COMPOSE
# ============================================
# Stack para desenvolvimento local
# Inclui: PostgreSQL, Redis, Adminer, RedisInsight
# ============================================

services:
  # ==========================================
  # POSTGRES - Banco de Dados Principal
  # ==========================================
  postgres:
    image: postgres:16
    container_name: archbase-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DATABASE:-archbase_db}
      POSTGRES_USER: ${POSTGRES_USER:-archbase}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeit}
      TZ: America/Sao_Paulo
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - archbase-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-archbase}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================
  # REDIS - Cache Distribuído
  # ==========================================
  redis:
    image: redis:7.2-alpine
    container_name: archbase-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - archbase-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ==========================================
  # ADMINER - Interface Web para PostgreSQL
  # ==========================================
  adminer:
    image: adminer:4.8.1
    container_name: archbase-adminer
    restart: unless-stopped
    ports:
      - "8081:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
      ADMINER_DESIGN: pepa-linha
    networks:
      - archbase-network
    depends_on:
      - postgres

  # ==========================================
  # REDISINSIGHT - Interface Web para Redis
  # ==========================================
  redisinsight:
    image: redis/redisinsight:latest
    container_name: archbase-redisinsight
    restart: unless-stopped
    ports:
      - "8001:5540"
    volumes:
      - redisinsight_data:/data
    networks:
      - archbase-network
    depends_on:
      - redis

# ==========================================
# NETWORKS
# ==========================================
networks:
  archbase-network:
    driver: bridge
    name: archbase-network

# ==========================================
# VOLUMES
# ==========================================
volumes:
  postgres_data:
    driver: local
    name: archbase-postgres-data

  redis_data:
    driver: local
    name: archbase-redis-data

  redisinsight_data:
    driver: local
    name: archbase-redisinsight-data
